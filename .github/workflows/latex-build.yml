name: Build CV PDF

on:
  push:
    branches: [ main ]

permissions:
  contents: write   # allows pushing CV.pdf back to the repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live (minimal)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra \
            texlive-science texlive-lang-english

      - name: Compile LaTeX
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          # rename output if needed
          test -f main.pdf && mv main.pdf CV.pdf

      - name: Commit compiled PDF back to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add CV.pdf
          git commit -m "Auto-update compiled CV.pdf" || echo "No changes to commit"
          git push
